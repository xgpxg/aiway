<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN"
        "https://raw.githubusercontent.com/rbatis/rbatis/master/rbatis-codegen/mybatis-3-mapper.dtd">

<mapper>
    <select id="list_page">
        <if test="do_count == true">select count(1)</if>
        <if test="do_count == false">select d.*</if>
        ` `
        from domain d
        <where>
            <if test="param.filter_text!=null && param.filter_text!=''">
                ` and (
                        d.domain like concat('%',#{param.filter_text},'%')
                    ) `
            </if>
            <if test="param.status!=null">` and d.status = #{param.status} `</if>
            <if test="param.protocol!=null">` and d.protocol = #{param.protocol} `</if>
            and d.is_delete = 0
        </where>
        <if test="do_count == false">` order by d.id desc `` limit ${page_no},${page_size} `</if>
    </select>
</mapper>
