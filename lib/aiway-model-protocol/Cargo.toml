[package]
name = "aiway-model-protocol"
version = "0.1.0"
edition = "2024"
authors = ["wxg <1584929962@qq.com>"]
description = "The aiway model protocol lib"
documentation = "https://docs.rs/aiway-model-protocol"
keywords = ["aiway", "model", "protocol"]
license = "Apache-2.0"
repository = "https://github.com/xgpxg/aiway"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
derive_builder = "0.20"
bytes = { version = "1", features = ["serde"] }
reqwest = { version = "0.13", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["fs"], optional = true }
tokio-util = { version = "0.7", features = ["codec"], optional = true }

[features]
stream = []
reqwest = ["dep:reqwest", "tokio", "tokio-util"]