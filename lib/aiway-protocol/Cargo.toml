[package]
name = "aiway-protocol"
version = "0.2.0"
edition = "2024"
authors = ["wxg <1584929962@qq.com>"]
description = "The aiway protocol lib"
documentation = "https://docs.rs/aiway-protocol"
keywords = ["aiway", "protocol"]
license = "Apache-2.0"
repository = "https://github.com/xgpxg/aiway"

[dependencies]
dashmap = { version = "6.1", features = ["serde"] }
serde = "1"
serde_json = { version = "1" }
chacha20poly1305 = { version = "0.10.1", optional = true }
base58 = { version = "0.2.0", optional = true }
uuid = { version = "1.18", features = ["v4"] }
chrono = { version = "0.4", optional = true }
rmcp = { version = "1.2.0", optional = true, features = [] }
http = "1"
http-serde = "2.1.1"
[features]
api-key = ["chacha20poly1305", "base58"]
logg = []
alert = ["chrono"]
model = []
mcp = ["rmcp/client", "rmcp/transport-streamable-http-client-reqwest"]
