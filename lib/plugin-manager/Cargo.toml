[package]
name = "plugin-manager"
version = "0.2.0"
edition = "2024"

[dependencies]
aiway-plugin = { path = "../aiway-plugin" }
aiway-protocol = { path = "../aiway-protocol" }
busi = { path = "../busi" }
logging = { path = "../logging" }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dashmap = "6.1"
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json", "query"] }
md5 = "0.8"
wasmtime = "46"
wasmtime-wasi = "46"
bincode = "1.3"
async-trait = "0.1.89"
semver = { version = "1.0", features = ["serde"] }
bytes = "1"
http = "1"
crossbeam = "0.8"
log = "0.4"

[features]
model = ["aiway-protocol/model", "aiway-plugin/model"]
