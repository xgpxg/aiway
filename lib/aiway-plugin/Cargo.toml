[package]
name = "aiway-plugin"
version = "0.3.0"
edition = "2024"
authors = ["wxg <1584929962@qq.com>"]
description = "The aiway plugin SDK"
documentation = "https://docs.rs/aiway-plugin"
keywords = ["aiway", "plugin"]
license = "Apache-2.0"
repository = "https://github.com/xgpxg/aiway"

[dependencies]
aiway-protocol = { path = "../aiway-protocol", version = "0.3.0" }
bincode = "1.3"
async-trait = "0.1.89"
serde_json = "1"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bytes = "1"
http = "1"
log = "0.4"

[features]
model = ["aiway-protocol/model"]
