[package]
name = "certs"
version = "0.1.0"
edition = "2021"

[dependencies]
acme2 = "0.8"
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "time"] }
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
