[package]
name = "gateway"
version = "0.2.2"
edition = "2024"

[dependencies]
aiway-protocol = { path = "../lib/aiway-protocol", features = ["api-key", "alert"] }
busi = { path = "../lib/busi" }
logging = { path = "../lib/logging", features = ["request-log"] }
loadbalance = { path = "../lib/loadbalance" }
aiway-plugin = { path = "../lib/aiway-plugin" }
cache = { path = "../lib/cache" }
alert = { path = "../lib/alert" }
common = { path = "../lib/common" }
tokio = { version = "1", features = ["macros", "io-util", "bytes", "sync", "time"] }
pingora = { version = "0.8.0", features = ["pingora-proxy", "proxy", "lb"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
dashmap = "6.1"
uuid = { version = "1.18", features = ["v4"] }
num_cpus = "1.16"
#tokio-util = "0.7"
reqwest = { version = "0.13", features = ["stream", "json", "query"] }
sysinfo = "0.38"
md5 = "0.8"
chrono = "0.4"
ip2region = { git = "https://github.com/lionsoul2014/ip2region.git", branch = "master" }
matchit = "0.9.1"
fastrand = { version = "2.3.0", optional = true }
aha-reqwest-eventsource = { version = "0.1.0", optional = true }
thiserror = { version = "2.0", optional = true }
tokio-stream = { version = "0.1", optional = true }
plugin-manager = { path = "../lib/plugin-manager" }
http = "1.4"
urlencoding = { version = "2.1.3", optional = true }
bytes = "1.6"
ipnet = "2"

[features]
default = ["model-proxy", "mcp-proxy"]
model-proxy = ["fastrand", "aha-reqwest-eventsource", "thiserror", "tokio-stream"]
mcp-proxy = ["aiway-protocol/mcp", "urlencoding"]
