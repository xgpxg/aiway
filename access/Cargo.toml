[package]
name = "access"
version = "0.1.0"
edition = "2024"

[dependencies]
aiway-protocol = { path = "../lib/aiway-protocol" }
logging = { path = "../lib/logging" }
common = { path = "../lib/common" }
busi = { path = "../lib/busi" }
tokio = { version = "1", features = ["macros", "io-util", "bytes", "sync", "time", "net", "rt-multi-thread"] }
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"
dashmap = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.13", features = ["json"] }
num_cpus = "1.16"
