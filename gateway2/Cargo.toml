[package]
name = "gateway2"
version = "0.2.1"
edition = "2024"

[dependencies]
aiway-protocol = { path = "../lib/aiway-protocol", features = ["api-key", "alert"] }
busi = { path = "../lib/busi" }
context = { path = "../lib/context" }
logging = { path = "../lib/logging", features = ["request-log"] }
loadbalance = { path = "../lib/loadbalance" }
aiway-plugin-v2 = { path = "../lib/aiway-plugin-v2" }
cache = { path = "../lib/cache" }
alert = { path = "../lib/alert" }
common = { path = "../lib/common" }
tokio = { version = "1", features = ["macros", "io-util", "bytes", "sync", "time"] }
pingora = { version = "0.8.0", features = ["lb"] }
pingora-core = {version = "0.8.0", features = ["s2n"]}
pingora-proxy = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
dashmap = "6.1"
uuid = { version = "1.18", features = ["v4"] }
num_cpus = "1.16"
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["stream", "json", "query"] }
sysinfo = "0.38"
md5 = "0.8"
chrono = "0.4"
ip2region = { git = "https://github.com/lionsoul2014/ip2region.git", branch = "master" }
matchit = "0.9.1"
fastrand = { version = "2.3.0", optional = true }
aha-reqwest-eventsource = { version = "0.1.0", optional = true }
aiway-model-protocol = { path = "../lib/aiway-model-protocol", optional = true, features = ["stream"] }
thiserror = { version = "2.0", optional = true }
tokio-stream = { version = "0.1", optional = true }
plugin-manager = { path = "../lib/plugin-manager", optional = true }
http = "1.4"
sse-stream = { version = "=0.2.1", optional = true }
urlencoding = { version = "2.1.3", optional = true }
hyper = { version = "1.4", features = ["full"] }
http-body-util = "0.1"
bytes = "1.6"
once_cell = "1.21"
url = "2.5"

[features]
default = ["model-proxy", "mcp-proxy"]
model-proxy = ["fastrand", "aha-reqwest-eventsource", "aiway-model-protocol", "thiserror", "tokio-stream", "plugin-manager"]
mcp-proxy = ["aiway-protocol/mcp", "urlencoding", "sse-stream"]
